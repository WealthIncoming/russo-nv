# Cloudflare Pages config for the `russonv` project.
# Used by `npx wrangler pages deploy` to attach bindings to a deployment.
# The site content is the prebuilt ./dist (advanced mode: public/_worker.js).
# Secrets (ADMIN_PASSWORD) are NOT here — set via `wrangler pages secret put`.
name = "russonv"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-06"

# Visitor log store for the private /_visits dashboard (see public/_worker.js).
[[d1_databases]]
binding = "DB"
database_name = "russo-visits"
database_id = "7d51fac0-079e-48a7-a0c8-74ad224f6901"

# Cloudflare Web Analytics beacon token (public, not secret) — injected into
# HTML responses by public/_worker.js on the live host only.
[vars]
WEB_ANALYTICS_TOKEN = "d6a1532efd204292821bbd4fb6b1fd5e"
